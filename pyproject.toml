[project]
name = "workout-telemetry"
version = "0.1.0"
description = "Event-driven streaming pipeline for workout telemetry and recovery analytics"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.35",
    "clickhouse-connect>=0.8,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack running"]
addopts = "-m 'not integration'"
