name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.LOCALSTACK_AUTH_TOKEN == ''
        run: echo "::notice::LOCALSTACK_AUTH_TOKEN secret not set, skipping integration tests"
      - uses: actions/setup-python@v5
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: pip install -e ".[dev]"
      - name: Start stack
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: |
          cp .env.example .env
          make up
          make schemas
      - name: Schema compatibility check (smoke test)
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: make schemas-check
      - name: Integration tests
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: pytest -m integration -v
      - name: Container logs
        if: failure() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose logs --tail=200
      - name: Tear down
        if: always() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose down -v
