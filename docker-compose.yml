name: workout-telemetry
x-telemetry-app: &telemetry-app
  build: .
  profiles: [apps]
  restart: unless-stopped
  environment:
    TELEMETRY_KAFKA_BOOTSTRAP: redpanda:9092
    TELEMETRY_SCHEMA_REGISTRY_URL: http://redpanda:8081
    TELEMETRY_S3_ENDPOINT: http://localstack:4566
    TELEMETRY_CLICKHOUSE_HOST: clickhouse
  depends_on:
    redpanda:
      condition: service_healthy
    localstack:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks: [telemetry-net]

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API for host clients
      - "18081:18081"   # Schema Registry for host clients
      - "9644:9644"     # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [telemetry-net]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [telemetry-net]

  localstack:
    image: localstack/localstack-pro:4.4.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      # healthy only when S3 is up AND the init script created the bucket
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket telemetry-bronze || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [telemetry-net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP: clickhouse-connect, /play
      - "9000:9000"   # native protocol: clickhouse-client
    environment:
      CLICKHOUSE_DB: telemetry
      CLICKHOUSE_USER: telemetry
      CLICKHOUSE_PASSWORD: telemetry
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user telemetry --password telemetry -q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [telemetry-net]

  bronze-sink:
    <<: *telemetry-app
    container_name: bronze-sink
    command: ["python", "-m", "telemetry.consumers.bronze_sink.main"]

  silver-loader:
    <<: *telemetry-app
    container_name: silver-loader
    command: ["python", "-m", "telemetry.consumers.silver_loader.main"]

  fatigue-windows:
    <<: *telemetry-app
    container_name: fatigue-windows
    command: ["python", "-m", "telemetry.processing.fatigue_windows.main"]

networks:
  telemetry-net:
    driver: bridge

volumes:
  redpanda-data:
  localstack-data:
  clickhouse-data:
