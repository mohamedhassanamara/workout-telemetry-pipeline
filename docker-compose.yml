name: workout-telemetry

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API for host clients
      - "18081:18081"   # Schema Registry for host clients
      - "9644:9644"     # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [telemetry-net]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [telemetry-net]

  localstack:
    image: localstack/localstack-pro:4.4.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      # healthy only when S3 is up AND the init script created the bucket
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket telemetry-bronze || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [telemetry-net]

networks:
  telemetry-net:
    driver: bridge

volumes:
  redpanda-data:
  localstack-data:
